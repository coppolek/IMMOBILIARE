# ==============================================================================
# Affitti Milano - Docker Compose for Hostinger VPS / Docker Manager
# ==============================================================================

services:
  affitti-milano:
    build:
      context: .
      dockerfile: Dockerfile
    image: affitti-milano:latest
    container_name: affitti_milano_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
