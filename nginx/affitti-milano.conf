# ==============================================================================
# Affitti Milano - Nginx Reverse Proxy Configuration for Hostinger VPS
# Path on Ubuntu VPS: /etc/nginx/sites-available/affitti-milano.conf
#
# Enable with:
#   sudo ln -s /etc/nginx/sites-available/affitti-milano.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# SSL Certificate Setup (Let's Encrypt):
#   sudo certbot --nginx -d tuo-dominio.it -d www.tuo-dominio.it
# ==============================================================================

# Upstream Node.js application (running on port 3000 via PM2 or Docker)
upstream affitti_milano_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP - Redirect all traffic to HTTPS (Certbot will manage this automatically)
server {
    listen 80;
    listen [::]:80;
    server_name tuo-dominio.it www.tuo-dominio.it;

    # ACME challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main Production Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tuo-dominio.it www.tuo-dominio.it;

    # SSL Certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/tuo-dominio.it/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tuo-dominio.it/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSL Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Max upload body size for listing image uploads & CSV batch imports
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Health check bypass for monitoring / uptime robots
    location = /api/health {
        proxy_pass http://affitti_milano_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Static assets cache (Vite generates content-hashed assets in /assets/)
    location /assets/ {
        proxy_pass http://affitti_milano_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Cache in browser for 1 year
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Main Application and API endpoints
    location / {
        proxy_pass http://affitti_milano_upstream;
        proxy_http_version 1.1;

        # WebSocket support (for realtime features / SSE)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Real client IP pass-through
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for low latency
        proxy_buffering off;
    }
}
